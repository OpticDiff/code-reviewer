version: 2

project_name: code-reviewer

builds:
  - main: ./cmd/code-reviewer
    binary: code-reviewer
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip

dockers:
  - image_templates:
      - "ghcr.io/opticdiff/{{ .ProjectName }}:{{ .Version }}"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=AI-powered code review CLI for GitHub and GitLab"
      - "--label=org.opencontainers.image.url=https://github.com/OpticDiff/code-reviewer"
      - "--label=org.opencontainers.image.source=https://github.com/OpticDiff/code-reviewer"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
    use: buildx
  - image_templates:
      - "ghcr.io/opticdiff/{{ .ProjectName }}:{{ .Version }}-arm64"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=AI-powered code review CLI for GitHub and GitLab"
      - "--label=org.opencontainers.image.url=https://github.com/OpticDiff/code-reviewer"
      - "--label=org.opencontainers.image.source=https://github.com/OpticDiff/code-reviewer"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
    use: buildx
    goarch: arm64

docker_manifests:
  - name_template: "ghcr.io/opticdiff/{{ .ProjectName }}:{{ .Version }}"
    image_templates:
      - "ghcr.io/opticdiff/{{ .ProjectName }}:{{ .Version }}"
      - "ghcr.io/opticdiff/{{ .ProjectName }}:{{ .Version }}-arm64"

brews:
  - repository:
      owner: OpticDiff
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/OpticDiff/code-reviewer
    description: "AI-powered code review CLI for GitLab and GitHub. Uses Vertex AI (Gemini, Claude, Mistral) to analyze diffs and post actionable findings."
    license: Apache-2.0
    install: |
      bin.install "code-reviewer"
    test: |
      system "#{bin}/code-reviewer", "--version"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
