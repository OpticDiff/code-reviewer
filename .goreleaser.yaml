version: 2

project_name: code-reviewer

builds:
  - main: ./cmd/code-reviewer
    binary: code-reviewer
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip

dockers_v2:
  - images:
      - "ghcr.io/opticdiff/{{ .ProjectName }}"
    tags:
      - "{{ .Version }}"
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "AI-powered code review CLI for GitHub and GitLab"
      org.opencontainers.image.url: https://github.com/OpticDiff/code-reviewer
      org.opencontainers.image.source: https://github.com/OpticDiff/code-reviewer
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: Apache-2.0

brews:
  - repository:
      owner: OpticDiff
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/OpticDiff/code-reviewer
    description: "AI-powered code review CLI for GitLab and GitHub. Uses Vertex AI (Gemini, Claude, Mistral) to analyze diffs and post actionable findings."
    license: Apache-2.0
    install: |
      bin.install "code-reviewer"
    test: |
      system "#{bin}/code-reviewer", "--version"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
