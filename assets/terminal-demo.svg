<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .cmd { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace; font-size: 14px; fill: #f8fafc; font-weight: 600; }
    .dim { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace; font-size: 13px; fill: #64748b; }
    .text { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace; font-size: 13px; fill: #cbd5e1; }
    .cyan { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace; font-size: 13px; fill: #38bdf8; font-weight: 600; }
    .badge-high { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #ffffff; font-weight: 700; }
    .file { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace; font-size: 13px; fill: #e2e8f0; font-weight: 600; }
    .diff-add { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace; font-size: 13px; fill: #34d399; }
    .green-text { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace; font-size: 13px; fill: #10b981; font-weight: 600; }
  </style>

  <!-- Terminal Window Frame -->
  <g filter="url(#shadow)">
    <rect width="900" height="450" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 886 0 C 893.732 0 900 6.268 900 14 L 900 42 L 0 42 Z" fill="#161b22" stroke="#30363d" stroke-width="0.5" />
    <circle cx="24" cy="21" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
    <circle cx="44" cy="21" r="6" fill="#ffbd2e" stroke="#dea125" stroke-width="0.5" />
    <circle cx="64" cy="21" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />
    <text x="450" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e" font-weight="500">code-reviewer — local diff inspection</text>
  </g>

  <!-- Terminal Content -->
  <g transform="translate(28, 70)">
    <!-- Command Prompt -->
    <text x="0" y="0">
      <tspan fill="#34d399">user@devbox</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~/code</tspan><tspan fill="#64748b">$ </tspan><tspan class="cmd">code-reviewer --diff --models gemini-2.5-flash,claude-sonnet-4</tspan>
    </text>

    <!-- Header Diagnostic Info -->
    <text x="0" y="32" class="cyan">🔍 code-reviewer v0.8.0 <tspan fill="#94a3b8">[local diff against origin/main]</tspan></text>
    <text x="0" y="54" class="dim">├── Models:  <tspan fill="#cbd5e1">gemini-2.5-flash + claude-sonnet-4</tspan> (Consensus threshold: 2/2)</text>
    <text x="0" y="74" class="dim">├── Context: <tspan fill="#cbd5e1">Tree-sitter</tspan> indexed 14 symbols across 6 unchanged files</text>
    <text x="0" y="94" class="dim">└── Cache:   <tspan fill="#cbd5e1">3 files cached</tspan>, 1 analyzed in 840ms (saved ~14,200 tokens)</text>

    <!-- Finding Box -->
    <g transform="translate(0, 122)">
      <rect width="844" height="150" rx="8" fill="#161b22" stroke="#ef4444" stroke-width="1" stroke-opacity="0.4" />
      
      <!-- High Badge -->
      <rect x="16" y="14" width="60" height="22" rx="4" fill="#dc2626" />
      <text x="46" y="30" text-anchor="middle" class="badge-high">HIGH</text>

      <text x="86" y="30" class="file">internal/auth/jwt.go:74</text>
      <text x="710" y="30" class="dim">category: security</text>

      <!-- Finding Description -->
      <text x="16" y="58" class="text"><tspan fill="#94a3b8">├─ Issue:</tspan> Token signature verification bypassed on empty secret</text>
      <text x="16" y="78" class="dim">├─ Rule:  OWASP-A02 (Cryptographic Failures) • Verified by 2 models</text>
      <text x="16" y="98" class="text"><tspan fill="#94a3b8">└─ Fix:</tspan></text>

      <!-- Code Suggestion Box -->
      <rect x="76" y="86" width="680" height="48" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="88" y="106" class="diff-add">+   if len(cfg.SecretKey) == 0 {</text>
      <text x="88" y="124" class="diff-add">+       return nil, fmt.Errorf("jwt: signing key cannot be empty")</text>
    </g>

    <!-- Summary Line -->
    <g transform="translate(0, 310)">
      <text x="0" y="0" class="green-text">✨ Review completed in 1.14s</text>
      <text x="0" y="22" class="text">1 finding reported <tspan fill="#64748b">(0 critical, 1 high, 0 medium, 0 low)</tspan> • SHA <tspan fill="#38bdf8">9a4f21b</tspan></text>
      <text x="0" y="44" class="dim">Audit trail recorded to .code-reviewer/audit.jsonl</text>
    </g>
  </g>
</svg>
