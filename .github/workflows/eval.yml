name: Persona Evaluation

on:
  schedule:
    # Weekly on Sundays at 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:
    # Allow manual triggers for ad-hoc validation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  eval:
    name: Persona Isolation
    runs-on: ubuntu-latest
    # Only run in the main repo, not forks
    if: github.repository == 'OpticDiff/code-reviewer'
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT }}
    steps:
      - name: Check GCP credentials
        if: env.GCP_SA_KEY == ''
        run: echo "Skipping persona evaluation: GCP_SA_KEY secret is not configured."

      - uses: actions/checkout@v4
        if: env.GCP_SA_KEY != ''

      - uses: actions/setup-go@v5
        if: env.GCP_SA_KEY != ''
        with:
          go-version: '1.26'

      - name: Authenticate to Google Cloud
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run persona evaluation suite
        if: env.GCP_SA_KEY != ''
        run: go test -tags=eval ./eval/ -v -timeout=600s -count=1

      - name: Upload eval results
        if: always() && env.GCP_SA_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/
          retention-days: 30
