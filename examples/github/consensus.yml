# ============================================================================
# GitHub Actions workflow for Multi-Model Consensus Code Review
#
# Features:
# - Executes Gemini 3.8 Flash and Claude Sonnet 5 in parallel on Vertex AI
# - Findings are deduplicated and merged by file + category + line proximity
# - Only findings with consensus threshold >= 2 are reported
# - Dramatically minimizes false positive review comments
# ============================================================================

name: Multi-Model Consensus Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  review:
    name: Multi-Model Consensus Review
    runs-on: ubuntu-latest

    steps:
      # Full git history is required for accurate base/head diff calculation
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Authenticate to Google Cloud using Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      # Run code-reviewer with multi-model consensus flags
      # Tip: Provide a PAT or GitHub App user token in secrets.CODE_REVIEWER_TOKEN
      # so GET /user succeeds and dismissed/open review threads are deduplicated across pushes.
      - name: Run code-reviewer
        uses: OpticDiff/code-reviewer@v0.26.0
        with:
          project-id: ${{ secrets.GCP_PROJECT }}
          models: gemini-3.8-flash,claude-sonnet-5
          consensus-threshold: "2"
          agent: "true"
          agent-scope: high_severity_only
          audit-log: review.jsonl
        env:
          GITHUB_TOKEN: ${{ secrets.CODE_REVIEWER_TOKEN || secrets.GITHUB_TOKEN }}

