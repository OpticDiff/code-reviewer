# === Option A: Quick setup with CI_JOB_TOKEN (no PAT needed) ===
# Uses simple MR notes. Zero configuration required.
code-review:
  stage: review
  image: gcr.io/$PROJECT/code-reviewer:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GITLAB_TOKEN: $CI_JOB_TOKEN
    REVIEW_COMMENT_MODE: "notes"
  script:
    - code-reviewer --ci --incremental
  allow_failure: true

# === Option B: Full-featured with PAT (inline diff comments + SARIF) ===
# Requires: Project Access Token with 'api' scope, stored as CODE_REVIEWER_TOKEN.
#
# To create:
#   1. Go to Settings > Access Tokens in your GitLab project
#   2. Create a token with 'api' scope, expiry 1 year
#   3. Add CODE_REVIEWER_TOKEN as a masked CI/CD variable

# Security gate (GitLab Ultimate) — blocks MR on high/critical findings.
# SARIF output appears in GitLab's Security tab (requires Ultimate).
# Uses --dismissal-mode resolve_only so plain replies do not dismiss HIGH/CRITICAL findings,
# and --agent --agent-scope high_severity_only to verify blocking findings against repo files.
security-review-ultimate:
  stage: review
  image: ghcr.io/opticdiff/code-reviewer:v0.26.1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GITLAB_TOKEN: $CODE_REVIEWER_TOKEN
    REVIEW_MODEL: "gemini-3.1-pro-preview"
    REVIEW_FOCUS: "security"
    REVIEW_MIN_SEVERITY: "high"
    REVIEW_COMMENT_MODE: "discussions"
    CODE_REVIEWER_CLEANUP_MODE: "resolve"
    REVIEW_DISMISSAL_MODE: "resolve_only"
    SARIF_OUTPUT: "results.sarif"
  script:
    - code-reviewer --ci --incremental --agent --agent-scope high_severity_only --audit-log review.jsonl
  allow_failure: false
  artifacts:
    paths:
      - review.jsonl
    reports:
      sarif: results.sarif
    when: always

# Security gate (GitLab Free/Premium) — blocks MR on high/critical findings.
# SAST output appears in GitLab's Security tab (works in Free/Premium).
security-review-free:
  stage: review
  image: ghcr.io/opticdiff/code-reviewer:v0.26.1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GITLAB_TOKEN: $CODE_REVIEWER_TOKEN
    REVIEW_MODEL: "gemini-3.1-pro-preview"
    REVIEW_FOCUS: "security"
    REVIEW_MIN_SEVERITY: "high"
    REVIEW_COMMENT_MODE: "discussions"
    CODE_REVIEWER_CLEANUP_MODE: "resolve"
    REVIEW_DISMISSAL_MODE: "resolve_only"
    SAST_OUTPUT: "gl-sast-report.json"
  script:
    - code-reviewer --ci --incremental --agent --agent-scope high_severity_only --audit-log review.jsonl
  allow_failure: false
  artifacts:
    paths:
      - review.jsonl
    reports:
      sast: gl-sast-report.json
    when: always

# General review — advisory, non-blocking, preserves thread history with cleanup-mode=resolve.
code-review-full:
  stage: review
  image: ghcr.io/opticdiff/code-reviewer:v0.26.1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GITLAB_TOKEN: $CODE_REVIEWER_TOKEN
    REVIEW_COMMENT_MODE: "discussions"
    CODE_REVIEWER_CLEANUP_MODE: "resolve"
  script:
    - code-reviewer --ci --incremental --audit-log review.jsonl
  allow_failure: true
  artifacts:
    paths:
      - review.jsonl
    when: always

